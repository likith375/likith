name: NeuralForge tests
on:
  push:
    paths:
      - "NeuralForge-RL-Lab/**"
      - ".github/workflows/neuralforge-tests.yml"
  pull_request:
    paths:
      - "NeuralForge-RL-Lab/**"
      - ".github/workflows/neuralforge-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NeuralForge-RL-Lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q backend adapters tests
      - run: node --check frontend/app.js
      - run: pytest -q
